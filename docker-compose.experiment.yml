version: '3.8'

# Overlay for running scaling experiments.
# Usage: docker-compose -f docker-compose.yml -f docker-compose.experiment.yml up --scale producer=5 --scale consumer=3

services:
  # Override Kafka to create topics with enough partitions for scaling
  kafka:
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 10

  # Create topics with proper partition counts before services start
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Kafka..."
        cub kafka-ready -b kafka:29092 1 60
        echo "Creating topics..."
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic crawl-jobs --partitions 10 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic page-metadata --partitions 10 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic analysis-results --partitions 10 --replication-factor 1
        echo "Topics created:"
        kafka-topics --bootstrap-server kafka:29092 --list
        echo "Done."

  # Producer: remove fixed host port so multiple instances don't conflict
  producer:
    ports: []

  # Consumer: no port changes needed (no ports exposed)
  # AI Service: no port changes needed (no ports exposed)
